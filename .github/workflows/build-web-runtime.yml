name: Build TRG WebAssembly runtime

on:
  push:
    branches: [main]
    paths:
      - "TRG.cpp"
      - "EditorSources.h"
      - "web-runtime/**"
      - ".github/workflows/build-web-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile and publish browser runtime
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout TRG source
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Compile the official C++ interpreter
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trg-web-runtime"
          em++ web-runtime/trg_web.cpp -I. -std=c++17 -O2 -fexceptions \
            -o "$RUNNER_TEMP/trg-web-runtime/trg-runtime.js" \
            --no-entry \
            -sEXPORT_ES6=1 \
            -sMODULARIZE=1 \
            -sEXPORT_NAME=createTRGModule \
            -sENVIRONMENT=web,node \
            -sNO_EXIT_RUNTIME=1 \
            -sALLOW_MEMORY_GROWTH=1 \
            -sFILESYSTEM=1 \
            -sFORCE_FILESYSTEM=1 \
            -sDISABLE_EXCEPTION_CATCHING=0 \
            -sASYNCIFY=1 \
            -s'EXPORTED_FUNCTIONS=["_trg_web_run","_trg_web_get_ui_snapshot","_malloc","_free"]' \
            -s'EXPORTED_RUNTIME_METHODS=["ccall","lengthBytesUTF8","stringToUTF8","UTF8ToString"]'

      - name: Smoke-test the compiled TRG runtime
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/trg-web-runtime/smoke-test.mjs" <<'EOF'
          import createTRGModule from "./trg-runtime.js";

          let output = "";
          globalThis.trgCompilerAppendOutput = value => { output += String(value ?? ""); };

          const module = await createTRGModule({
            locateFile: name => new URL(name, import.meta.url).href
          });
          module.FS_createDataFile("/", "pixel.png", new Uint8Array(Buffer.from("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/pXcAAAAASUVORK5CYII=", "base64")), true, true, true);
          await module.ccall("trg_web_run", null, ["string"], [
            'add (ui)\nblock x 10 y 15 w 30 h 20 color #8B5CF6 name panel\nsprite sample "pixel.png" x 50 y 50 w 10 h 10\ntext "TRG preview" x 10 y 42 size 6 color #FFFFFF\nsay "TRG WebAssembly smoke test passed"'
          ], { async: true });
          const uiPointer = module.ccall("trg_web_get_ui_snapshot", "number", [], []);
          const ui = JSON.parse(module.UTF8ToString(uiPointer));
          if (!output.includes("TRG WebAssembly smoke test passed")) {
            throw new Error("The interpreter did not return the expected output: " + output);
          }
          if (output.includes("Program finished")) {
            throw new Error("The web terminal should not display the interpreter completion banner: " + output);
          }
          if (!ui || ui.blocks?.length !== 1 || ui.sprites?.length !== 1 || ui.texts?.length !== 1 || !ui.sprites[0].data.startsWith("data:image/png;base64,")) {
            throw new Error("The UI preview bridge did not return the expected block and text: " + JSON.stringify(ui));
          }
          console.log(output.trim());
          console.log("UI preview smoke test passed: " + ui.blocks.length + " block, " + ui.sprites.length + " sprite, " + ui.texts.length + " text.");

          output = "";
          await module.ccall("trg_web_run", null, ["string"], [
            'say "TRG_BROWSER_ORIENTATION=" orientation\nsay "TRG_BROWSER_RATIO=" aspect_ratio'
          ], { async: true });
          if (!output.includes("TRG_BROWSER_ORIENTATION=landscape") ||
              !output.includes("TRG_BROWSER_RATIO=16:9")) {
            throw new Error("Browser orientation/aspect-ratio detection failed: " + output);
          }
          console.log("Browser orientation and aspect-ratio smoke test passed.");

          output = "";
          globalThis.trgCompilerRequestInput = resolve => resolve("Ada");
          await module.ccall("trg_web_run", null, ["string"], [
            'var name = "there"\nask "What is your name?" name\nsay "Hello," name'
          ], { async: true });
          if (!output.includes("What is your name?") || !output.includes("Hello, Ada")) {
            throw new Error("Terminal input smoke test failed: " + output);
          }
          console.log("Terminal input smoke test passed.");

          output = "";
          globalThis.trgCompilerRequestInput = resolve => resolve("yas fatherin");
          await module.ccall("trg_web_run", null, ["string"], [
            'word name = "huss"\nask "huss" name\nsay "absolutely king"\nif name = "yas fatherin"\n(\n  say "sure baba grill I\'m a man tho"\n)'
          ], { async: true });
          if (!output.includes("absolutely king") || !output.includes("sure baba grill I'm a man tho")) {
            throw new Error("Typed-word/string-condition regression failed: " + output);
          }
          console.log("Typed word + string equality + parenthesis block smoke test passed.");

          output = "";
          globalThis.trgCompilerRequestInput = resolve => resolve("yas fatherin");
          await module.ccall("trg_web_run", null, ["string"], [
            'word name = "huss"\nask "huss" name\nif name = "yas fatherin"\n(\n  say "legacy parentheses still work"\n)'
          ], { async: true });
          if (!output.includes("legacy parentheses still work")) {
            throw new Error("Legacy parenthesis-block regression failed: " + output);
          }
          console.log("Legacy parenthesis block smoke test passed.");
          
          output = "";
          await module.ccall("trg_web_run", null, ["string"], [
            'add (ui)\nadd (style)\nstyle name glow (\n background #171329\n glow #A88AFF 0.8\n radius 12\n opacity 0.9\n)\nblock name panel x 10 y 10 w 40 h 20 color #FFFFFF\nstyle apply panel glow\nsay "TRG style library smoke test passed"'
          ], { async: true });
          const styledPointer = module.ccall("trg_web_get_ui_snapshot", "number", [], []);
          const styledUi = JSON.parse(module.UTF8ToString(styledPointer));
          if (!output.includes("TRG style library smoke test passed") ||
              styledUi.blocks?.length !== 1 ||
              styledUi.blocks[0].glowColor !== "#A88AFF" ||
              Math.abs(styledUi.blocks[0].glowIntensity - 0.8) > 0.001 ||
              Math.abs(styledUi.blocks[0].cornerRadius - 12) > 0.001) {
            throw new Error("Style library smoke test failed: " + output + " " + JSON.stringify(styledUi));
          }
          console.log("TRG style library smoke test passed.");

          EOF
          node "$RUNNER_TEMP/trg-web-runtime/smoke-test.mjs"

      - name: Publish tested runtime to the web-runtime branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan web-runtime
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p compiler
          cp "$RUNNER_TEMP/trg-web-runtime/trg-runtime.js" compiler/
          cp "$RUNNER_TEMP/trg-web-runtime/trg-runtime.wasm" compiler/
          cat > README.md <<'EOF'
          Generated TRG browser runtime. Built from the official TRG C++ interpreter by GitHub Actions.
          EOF
          git add compiler README.md
          git commit -m "Publish tested TRG WebAssembly runtime"
          git push --force origin web-runtime
