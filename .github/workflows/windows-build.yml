name: TRG Windows desktop build

on:
  push:
    branches: [main]
    paths:
      - "TRG.cpp"
      - "Checker.cpp"
      - "build.bat"
      - "build-installer.bat"
      - "EditorSources.h"
      - "TRG.rc"
      - "TRG-Installer.cpp"
      - "TRG-Installer.rc"
      - "TRG-Example.trg"
      - "2DEditor.trg"
      - "3DEditor.trg"
      - "resource.h"
      - "trg.ico"
      - ".github/workflows/windows-build.yml"
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build the UI application
        shell: cmd
        run: |
          rc.exe /nologo /fo trg-resource.res TRG.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /std:c++17 /EHsc /O2 /MT /DTRG_FORCE_UI_APP TRG.cpp trg-resource.res /link /SUBSYSTEM:WINDOWS comdlg32.lib shell32.lib gdiplus.lib user32.lib gdi32.lib winhttp.lib winmm.lib /OUT:TRG-build.exe
          if errorlevel 1 exit /b 1
          copy /Y TRG-build.exe UI-app.exe
          if errorlevel 1 exit /b 1
          copy /Y TRG-build.exe TRG.exe
          if errorlevel 1 exit /b 1

      - name: Build the console application
        shell: cmd
        run: |
          cl.exe /nologo /std:c++17 /EHsc /O2 /MT /DTRG_FORCE_CONSOLE_APP TRG.cpp trg-resource.res /link /SUBSYSTEM:WINDOWS comdlg32.lib shell32.lib gdiplus.lib user32.lib gdi32.lib winhttp.lib winmm.lib /OUT:Console-app.exe
          if errorlevel 1 exit /b 1

      - name: Build Checker
        shell: cmd
        run: |
          cl.exe /nologo /std:c++17 /EHsc /O2 /MT Checker.cpp trg-resource.res /link /SUBSYSTEM:WINDOWS shell32.lib user32.lib /OUT:Checker.exe
          if errorlevel 1 exit /b 1

      - name: Build TRG installer
        shell: cmd
        run: |
          rc.exe /nologo /fo trg-installer-resource.res TRG-Installer.rc
          if errorlevel 1 exit /b 1
          cl.exe /nologo /std:c++17 /EHsc /O2 /MT TRG-Installer.cpp trg-installer-resource.res /link /SUBSYSTEM:WINDOWS comctl32.lib shell32.lib advapi32.lib ole32.lib uuid.lib user32.lib gdi32.lib /OUT:TRG-Installer.exe
          if errorlevel 1 exit /b 1

      - name: Verify generated executables
        shell: pwsh
        run: |
          foreach ($file in @("TRG-build.exe", "TRG.exe", "UI-app.exe", "Console-app.exe", "Checker.exe", "TRG-Installer.exe")) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "$file is missing or empty." }
          }
