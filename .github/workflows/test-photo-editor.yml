name: Test TRG creative applications

on:
  push:
    branches: [main]
    paths:
      - "apps/photo-editor/**"
      - "apps/font-maker/**"
      - ".github/workflows/test-photo-editor.yml"
  pull_request:
    paths:
      - "apps/photo-editor/**"
      - "apps/font-maker/**"
      - ".github/workflows/test-photo-editor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trg-creative-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  photo-editor-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure photo editor core
        run: cmake -S apps/photo-editor -B build/photo-editor -DCMAKE_BUILD_TYPE=Release -DTRG_PHOTO_EDITOR_BUILD_UI=OFF
      - name: Build photo editor core
        run: cmake --build build/photo-editor --parallel
      - name: Test photo editor operations
        run: ctest --test-dir build/photo-editor --output-on-failure

  font-maker-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure font maker core
        run: cmake -S apps/font-maker -B build/font-maker -DCMAKE_BUILD_TYPE=Release -DTRG_FONT_MAKER_BUILD_UI=OFF
      - name: Build font maker core
        run: cmake --build build/font-maker --parallel
      - name: Test TrueType export
        run: ctest --test-dir build/font-maker --output-on-failure

  qt-desktop-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev
      - name: Configure Photo Editor
        run: cmake -S apps/photo-editor -B build/photo-editor-qt -DCMAKE_BUILD_TYPE=Release -DTRG_PHOTO_EDITOR_BUILD_UI=ON
      - name: Build Photo Editor
        run: cmake --build build/photo-editor-qt --parallel
      - name: Configure Font Maker
        run: cmake -S apps/font-maker -B build/font-maker-qt -DCMAKE_BUILD_TYPE=Release -DTRG_FONT_MAKER_BUILD_UI=ON
      - name: Build Font Maker
        run: cmake --build build/font-maker-qt --parallel
