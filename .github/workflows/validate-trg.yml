name: TRG Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TRG.cpp"
      - "TRG.rc"
      - "resource.h"
      - "build.bat"
      - "compile_console.bat"
      - ".github/workflows/validate-trg.yml"
  pull_request:
    branches: [main]
    paths:
      - "TRG.cpp"
      - "TRG.rc"
      - "resource.h"
      - "build.bat"
      - "compile_console.bat"
      - ".github/workflows/validate-trg.yml"

permissions:
  contents: read

concurrency:
  group: trg-windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Compile TRG desktop and console executables
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MinGW-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc
          suppress-deprecation-warnings: msystem-mingw64

      - name: Compile TRG console executable using project build script
        shell: pwsh
        env:
          CI: "true"
          TRG_NO_PAUSE: "1"
        run: |
          cmd /c compile_console.bat
          if ($LASTEXITCODE -ne 0) {
            throw "compile_console.bat failed."
          }
          if (!(Test-Path ".\\TRG-console.exe")) {
            throw "TRG-console.exe was not produced."
          }

      - name: Compile TRG desktop executable using project build script
        shell: pwsh
        env:
          CI: "true"
          TRG_NO_PAUSE: "1"
        run: |
          cmd /c build.bat
          if ($LASTEXITCODE -ne 0) {
            throw "build.bat failed."
          }
          if (!(Test-Path ".\\TRG-build.exe")) {
            throw "TRG-build.exe was not produced."
          }

      - name: Upload compiled executables
        uses: actions/upload-artifact@v4
        with:
          name: TRG-Windows-builds
          path: |
            TRG-build.exe
            TRG-console.exe
          if-no-files-found: error
          retention-days: 14
