name: TRG Mobile APK build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "TRG.cpp"
      - "android-app/**"
      - "build-apk.bat"
      - ".github/workflows/validate-trg.yml"
  pull_request:
    branches: [main]
    paths:
      - "TRG.cpp"
      - "android-app/**"
      - "build-apk.bat"
      - ".github/workflows/validate-trg.yml"

permissions:
  contents: read

concurrency:
  group: trg-mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Compile TRG Studio for Android
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android debug APK
        shell: pwsh
        env:
          CI: "true"
          TRG_NO_PAUSE: "1"
        run: |
          .\\build-apk.bat
          if ($LASTEXITCODE -ne 0) {
            throw "The Android APK build failed."
          }

      - name: Verify APK
        shell: pwsh
        run: |
          $apk = "android-app/app/build/outputs/apk/debug/app-debug.apk"
          if (!(Test-Path $apk)) {
            throw "Android APK was not produced: $apk"
          }
          Write-Host "Android APK created successfully."

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: TRG-Studio-Android-debug-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
