name: TRG Android app builds

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - "apps/photo-editor/android/**"
      - "apps/font-maker/android/**"
      - "apps/photo-editor/android/**"
      - "apps/font-maker/android/**"
      - "build-apk.bat"
      - "TRG.cpp"
      - "EditorSources.h"
      - ".github/workflows/build.yml"
  pull_request:
    branches: [main]
    paths:
      - "android-app/**"
      - "build-apk.bat"
      - "TRG.cpp"
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: trg-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build TRG Android applications
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: pwsh
        env:
          CI: "true"
          TRG_NO_PAUSE: "1"
        run: |
          .\build-apk.bat
          if ($LASTEXITCODE -ne 0) {
            throw "The Android APK build failed."
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRG-Android-Apps
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            apps/photo-editor/android/build/outputs/apk/debug/*.apk
            apps/font-maker/android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
