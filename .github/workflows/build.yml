name: TRG builds

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
      - name: Build desktop app and installer
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          .\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\compile_console.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testOutput = & .\TRG-console.exe .\tests\collections_strings.trg 2>&1 | Out-String
          Write-Host $testOutput
          if ($LASTEXITCODE -ne 0 -or $testOutput -notmatch "TRG_FEATURE_TESTS_PASSED" -or $testOutput -match "ERROR ") {
            throw "TRG language regression tests failed."
          }
          .\build-installer.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build Android APK with Gradle
        shell: pwsh
        working-directory: android-app
        run: .\gradlew.bat --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TRG-Studio-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
