name: TRG builds

concurrency:
  group: trg-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils
      - name: Build desktop app and installer
        shell: pwsh
        run: |
          $env:Path = "C:\msys64\mingw64\bin;" + $env:Path
          .\build.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\compile_console.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testOutput = & .\TRG-console.exe .\tests\collections_strings.trg 2>&1 | Out-String
          Write-Host $testOutput
          if ($LASTEXITCODE -ne 0 -or $testOutput -notmatch "TRG_FEATURE_TESTS_PASSED" -or $testOutput -match "ERROR ") {
            throw "TRG collection/string regression tests failed."
          }
          $beginnerOutput = & .\TRG-console.exe .\tests\beginner_syntax.trg 2>&1 | Out-String
          Write-Host $beginnerOutput
          if ($LASTEXITCODE -ne 0 -or $beginnerOutput -notmatch "TRG_BEGINNER_TESTS_PASSED" -or $beginnerOutput -match "ERROR ") {
            throw "TRG beginner syntax regression tests failed."
          }
          $aiOutput = & .\TRG-console.exe .\tests\ai_library.trg 2>&1 | Out-String
          Write-Host $aiOutput
          if ($LASTEXITCODE -ne 0 -or $aiOutput -notmatch "TRG_AI_TESTS_PASSED" -or $aiOutput -match "ERROR ") {
            throw "TRG AI library regression tests failed."
          }
          $mathOutput = & .\TRG-console.exe .\tests\math_library.trg 2>&1 | Out-String
          Write-Host $mathOutput
          if ($LASTEXITCODE -ne 0 -or $mathOutput -notmatch "TRG_MATH_TESTS_PASSED" -or $mathOutput -match "ERROR ") {
            throw "TRG math library regression tests failed."
          }
          $jsonOutput = & .\TRG-console.exe .\test_json.trg 2>&1 | Out-String
          Write-Host $jsonOutput
          if ($LASTEXITCODE -ne 0 -or $jsonOutput -notmatch "Read back score: 100" -or $jsonOutput -notmatch "Read back player: Hero" -or $jsonOutput -notmatch "Read back ready: true" -or $jsonOutput -match "ERROR ") {
            throw "TRG JSON read/write regression test failed."
          }
          .\build-installer.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  android:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android build components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-35" "build-tools;36.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Build Android APK with build-apk.bat
        shell: pwsh
        run: .\build-apk.bat
      - uses: actions/upload-artifact@v4
        with:
          name: TRG-Studio-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
